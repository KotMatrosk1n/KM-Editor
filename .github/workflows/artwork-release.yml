name: Artwork Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artwork-release

jobs:
  artwork:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.13.1
      - run: pnpm install --frozen-lockfile
      - name: Package and sign artwork
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          output="$RUNNER_TEMP/km-artwork"
          node apps/desktop/scripts/build-artwork.mjs pack "$output" artwork
          pnpm --dir apps/desktop exec tauri signer sign "$output/artwork-manifest.json"
          node apps/desktop/scripts/build-artwork.mjs envelope "$output"
      - name: Publish artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output="$RUNNER_TEMP/km-artwork"
          pack=("$output"/artwork-*.pack)
          if gh release view artwork >/dev/null 2>&1; then
            name="$(basename "${pack[0]}")"
            if ! gh release view artwork --json assets --jq '.assets[].name' | grep -Fx "$name"; then
              gh release upload artwork "${pack[0]}"
            fi
            gh release upload artwork "$output/artwork.json" --clobber
          else
            gh release create artwork "${pack[0]}" "$output/artwork.json" --target "$GITHUB_SHA" --title "KM Editor Artwork" --notes "Artwork for KM Editor." --prerelease --latest=false
          fi
