name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  checks: read

jobs:
  windows:
    name: Windows desktop package
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\apps\desktop\src-tauri\target
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify release source passed product builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $parentLine = (git show -s --format='%P' $env:GITHUB_SHA).Trim()
          $parents = @($parentLine -split '\s+' | Where-Object { $_ })
          if ($parents.Count -ne 2) {
            throw "Release source '$env:GITHUB_SHA' must be a build-checked pull request merge commit."
          }

          $buildCheckedCommit = $parents[1]
          git diff --quiet $buildCheckedCommit $env:GITHUB_SHA --
          if ($LASTEXITCODE -ne 0) {
            throw "Release source '$env:GITHUB_SHA' does not match build-checked pull request head '$buildCheckedCommit'."
          }

          $responseJson = gh api `
            --method GET `
            -H 'Accept: application/vnd.github+json' `
            "repos/$env:GITHUB_REPOSITORY/commits/$buildCheckedCommit/check-runs?per_page=100&filter=latest"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read product build checks for '$buildCheckedCommit'."
          }

          $checkRuns = @(($responseJson | ConvertFrom-Json).check_runs)
          $requiredChecks = @(
            'Build / Desktop',
            'Build / Backend'
          )

          foreach ($requiredCheck in $requiredChecks) {
            $successfulRuns = @($checkRuns | Where-Object {
              $_.app.slug -eq 'github-actions' -and
              $_.name -eq $requiredCheck -and
              $_.status -eq 'completed' -and
              $_.conclusion -eq 'success'
            })
            if ($successfulRuns.Count -eq 0) {
              throw "Required check '$requiredCheck' did not pass for '$buildCheckedCommit'."
            }
          }

          Write-Host "Release source matches build-checked pull request head $buildCheckedCommit."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache backend packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default 1.96.0
          $rustCacheVersion = (rustc --version).Trim() -replace '[^0-9A-Za-z._-]', '-'
          "RUST_CACHE_VERSION=$rustCacheVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache desktop Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: rust-${{ runner.os }}-${{ env.RUST_CACHE_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ env.RUST_CACHE_VERSION }}-

      - name: Verify release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$env:RELEASE_TAG' must look like v0.1.0."
          }

          $expectedVersion = $env:RELEASE_TAG.Substring(1)
          node .\scripts\release-version.mjs --check $expectedVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Release version verification failed for '$env:RELEASE_TAG'."
          }

      - name: Verify custom setup release approvals
        shell: pwsh
        env:
          WIX_V7_EULA_ACCEPTED: ${{ vars.WIX_V7_EULA_ACCEPTED }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:WIX_V7_EULA_ACCEPTED -ne 'true') {
            throw 'Set WIX_V7_EULA_ACCEPTED=true only after the WiX v7 OSMF EULA has been reviewed and accepted.'
          }

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY must be configured before building updater artifacts.'
          }

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Restore backend
        shell: pwsh
        run: dotnet restore .\KM.Editor.slnx

      - name: Build desktop application
        shell: pwsh
        run: pnpm --dir apps/desktop exec tauri build --ci --no-bundle --no-sign

      - name: Build custom Windows setup
        shell: pwsh
        env:
          WIX_V7_EULA_ACCEPTED: ${{ vars.WIX_V7_EULA_ACCEPTED }}
        run: |
          if ($env:WIX_V7_EULA_ACCEPTED -ne 'true') {
            throw 'Set repository variable WIX_V7_EULA_ACCEPTED=true only after the WiX v7 OSMF EULA has been reviewed and accepted.'
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/dist/release'
          $webView2Path = Join-Path $env:RUNNER_TEMP 'km-webview2/MicrosoftEdgeWebview2Setup.exe'
          $sidecarPath = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/binaries/km-tools-bridge-x86_64-pc-windows-msvc.exe'

          & .\installer\windows\scripts\Get-WebView2Bootstrapper.ps1 `
            -DestinationFile $webView2Path

          & .\installer\windows\scripts\Build-KmWindowsSetup.ps1 `
            -Version $version `
            -CargoTargetDirectory $env:CARGO_TARGET_DIR `
            -SidecarPath $sidecarPath `
            -WebView2BootstrapperPath $webView2Path `
            -OutputDirectory $releaseDir `
            -AcceptWixEula

      - name: Sign custom updater artifact
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY must be configured before signing updater artifacts.'
          }

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/dist/release'
          $version = $env:RELEASE_TAG.Substring(1)
          $setupName = "KM.Editor.Setup_${version}_x64.exe"
          $setupPath = Join-Path $releaseDir $setupName
          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "Could not find the expected custom setup executable '$setupName'."
          }

          pnpm --dir apps/desktop exec tauri signer sign $setupPath

      - name: Stage release assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/dist/release'
          $version = $env:RELEASE_TAG.Substring(1)
          $setupName = "KM.Editor.Setup_${version}_x64.exe"
          $setupPath = Join-Path $releaseDir $setupName
          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "Could not find the expected custom setup executable '$setupName'."
          }

          $setup = Get-Item -LiteralPath $setupPath
          $signaturePath = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Could not find updater signature '$signaturePath'."
          }

          $receiptPath = "$($setup.FullName).build.json"
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
            throw "Could not find the setup build receipt '$receiptPath'."
          }

          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "Could not parse the setup build receipt '$receiptPath': $($_.Exception.Message)"
          }

          if (([string]$receipt.version) -cne $version) {
            throw "Setup build receipt version '$($receipt.version)' does not match '$version'."
          }
          if (([string]$receipt.file) -cne $setupName) {
            throw "Setup build receipt file '$($receipt.file)' does not match '$setupName'."
          }

          if (([string]$receipt.architecture) -cne 'x64') {
            throw "Setup build receipt architecture '$($receipt.architecture)' is not 'x64'."
          }

          $recordedHash = ([string]$receipt.sha256).Trim().ToLowerInvariant()
          if ($recordedHash -notmatch '^[0-9a-f]{64}$') {
            throw 'Setup build receipt does not contain a valid SHA-256 digest.'
          }

          $actualHash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($recordedHash -cne $actualHash) {
            throw "Setup build receipt SHA-256 '$recordedHash' does not match '$actualHash'."
          }

          Remove-Item -LiteralPath $receiptPath -Force
          if (Test-Path -LiteralPath $receiptPath) {
            throw "Could not remove the setup build receipt '$receiptPath'."
          }

          function New-UpdaterPlatform($installer) {
            $signaturePath = Join-Path $releaseDir "$($installer.Name).sig"
            if (-not (Test-Path -LiteralPath $signaturePath)) {
              throw "Could not find updater signature '$($installer.Name).sig'."
            }

            $assetName = [System.Uri]::EscapeDataString($installer.Name)
            return [ordered]@{
              signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$assetName"
            }
          }

          $windowsPlatform = New-UpdaterPlatform $setup
          $latestJson = [ordered]@{
            version = $version
            notes = "See the GitHub Release notes for KM Editor $env:RELEASE_TAG."
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64-nsis' = $windowsPlatform
              'windows-x86_64-msi' = $windowsPlatform
              'windows-x86_64' = $windowsPlatform
            }
          }

          $latestJson |
            ConvertTo-Json -Depth 8 |
            Set-Content -Path (Join-Path $releaseDir 'latest.json') -Encoding utf8

          $allowedBeforeChecksums = @(
            $setup.Name,
            "$($setup.Name).sig",
            'latest.json'
          )
          $unexpectedBeforeChecksums = @(
            Get-ChildItem -LiteralPath $releaseDir -File |
              Where-Object { $_.Name -notin $allowedBeforeChecksums }
          )
          if ($unexpectedBeforeChecksums.Count -ne 0) {
            throw "Unexpected release assets before checksums: $($unexpectedBeforeChecksums.Name -join ', ')."
          }

          $hashLines = Get-ChildItem $releaseDir -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }

          $hashLines | Set-Content -Path (Join-Path $releaseDir 'SHA256SUMS.txt') -Encoding utf8

          $allowedFinalAssets = $allowedBeforeChecksums + 'SHA256SUMS.txt'
          $finalAssets = @(Get-ChildItem -LiteralPath $releaseDir -File)
          $unexpectedFinalAssets = @($finalAssets | Where-Object { $_.Name -notin $allowedFinalAssets })
          $missingFinalAssets = @($allowedFinalAssets | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $releaseDir $_) -PathType Leaf)
          })
          if ($unexpectedFinalAssets.Count -ne 0 -or $missingFinalAssets.Count -ne 0) {
            throw "Release asset allowlist failed. Unexpected: $($unexpectedFinalAssets.Name -join ', '); missing: $($missingFinalAssets -join ', ')."
          }

          Get-ChildItem $releaseDir -File | Sort-Object Name | Format-Table Name, Length

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/dist/release'
          $assets = Get-ChildItem $releaseDir -File | Sort-Object Name | ForEach-Object { $_.FullName }
          $arguments = @(
            'release',
            'create',
            $env:RELEASE_TAG
          ) + $assets + @(
            '--repo',
            $env:GITHUB_REPOSITORY,
            '--target',
            $env:GITHUB_SHA,
            '--title',
            "KM Editor $env:RELEASE_TAG",
            '--draft',
            '--generate-notes'
          )

          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }

          gh @arguments
