# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "km-editor-desktop"
version = "2.7.2"
description = "KM Editor desktop shell"
authors = []
license = "GPL-3.0-only"
repository = "https://github.com/KotMatrosk1n/KM-Editor"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "km_editor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Required by tauri::generate_context! macro expansion even though no source file imports it directly.
serde_json = "1.0"
base64 = "0.22"
dirs = "6"
fs2 = "0.4"
minisign-verify = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tempfile = "3.27.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
# Update releases use signed installer files directly.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2.3.1"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
zstd = "0.13"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
wgpu = { version = "26.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = "0.30.12"
pollster = "0.4"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
